<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" rx="24" fill="#f3f5ed"/><g font-family="Arial" fill="#173e31"><text x="55" y="66" font-size="37" font-weight="bold">Match the documents, not just the label</text><rect x="50" y="105" width="1100" height="110" rx="14" fill="#deebdf"/><text x="80" y="175" font-size="45">1</text><text x="160" y="148" font-size="28" font-weight="bold">ORIGINAL LICENSE</text><text x="160" y="188" font-size="27">Physical document, validity and issuing country</text><rect x="50" y="230" width="1100" height="110" rx="14" fill="#deebdf"/><text x="80" y="300" font-size="45">2</text><text x="160" y="273" font-size="28" font-weight="bold">TRANSLATION / IDP</text><text x="160" y="313" font-size="27">Match the language and the actual policy</text><rect x="50" y="355" width="1100" height="110" rx="14" fill="#deebdf"/><text x="80" y="425" font-size="45">3</text><text x="160" y="398" font-size="28" font-weight="bold">PICKUP SCOPE</text><text x="160" y="438" font-size="27">Keep identification and other conditions separate</text></g></svg>