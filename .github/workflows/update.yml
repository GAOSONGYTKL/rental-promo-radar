name: Refresh official rental offers
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rental-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate config and tests
        run: |
          python -m unittest discover -s tests -v
          python -c "from config import load_config; assert load_config()['update_cron'] == '17 */6 * * *', 'Update workflow cron to match config'"
      - name: Fetch official sources
        run: python scraper.py
      - name: Build static site
        run: python build.py
      - name: Commit source-check results
        run: |
          git config user.name 'rental-promo-radar[bot]'
          git config user.email 'rental-promo-radar[bot]@users.noreply.github.com'
          git add data/offers.json site
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official source checks and static site'
            git push
          fi
