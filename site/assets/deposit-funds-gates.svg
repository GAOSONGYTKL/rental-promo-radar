<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#f4f4ec"/><text x="60" y="75" font-family="Arial" font-size="40" font-weight="bold" fill="#173e31">Separate the money before counting it</text><rect x="60" y="125" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="205" font-family="Arial" font-size="48" fill="#2c624b">1</text><text x="170" y="173" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">PICKUP HOLD / COLLECTION</text><text x="170" y="219" font-family="Arial" font-size="27" fill="#344a3c">Identify the security amount and transaction</text><rect x="60" y="285" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="365" font-family="Arial" font-size="48" fill="#2c624b">2</text><text x="170" y="333" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">RENTAL CHARGES</text><text x="170" y="379" font-family="Arial" font-size="27" fill="#344a3c">Age-related fees are not automatically deposits</text><rect x="60" y="445" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="525" font-family="Arial" font-size="48" fill="#2c624b">3</text><text x="170" y="493" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">FINAL BILL + BANK POSTING</text><text x="170" y="539" font-family="Arial" font-size="27" fill="#344a3c">Reconcile retained charges, release and refund</text></svg>