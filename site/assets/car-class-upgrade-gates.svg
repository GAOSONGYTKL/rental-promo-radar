<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#f4f4ec"/><text x="60" y="75" font-family="Arial" font-size="40" font-weight="bold" fill="#173e31">Check where the upgrade takes you</text><rect x="60" y="125" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="205" font-family="Arial" font-size="48" fill="#2c624b">1</text><text x="170" y="173" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">RESERVED → PROPOSED</text><text x="170" y="219" font-family="Arial" font-size="27" fill="#344a3c">Keep both company-specific class labels</text><rect x="60" y="285" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="365" font-family="Arial" font-size="48" fill="#2c624b">2</text><text x="170" y="333" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">DESTINATION ELIGIBILITY</text><text x="170" y="379" font-family="Arial" font-size="27" fill="#344a3c">Match the proposed group to the age rule</text><rect x="60" y="445" width="1080" height="130" rx="18" fill="#dfebe1"/><text x="90" y="525" font-family="Arial" font-size="48" fill="#2c624b">3</text><text x="170" y="493" font-family="Arial" font-size="30" font-weight="bold" fill="#173e31">OFFER + COST + RELEASE</text><text x="170" y="539" font-family="Arial" font-size="27" fill="#344a3c">Confirm the ceiling, charge and assigned car</text></svg>