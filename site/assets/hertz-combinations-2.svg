<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" rx="20" fill="#102c34"/><rect x="48" y="45" width="72" height="7" fill="#edc36a"/><g font-family="Arial,sans-serif"><text x="48" y="102" font-size="17" fill="#edc36a">RENTAL PROMO RADAR  /  COMBINATION CHECK</text><text x="48" y="172" font-size="38" font-weight="bold" fill="#fff">Keep three questions separate</text><text x="48" y="217" font-size="23" fill="#c6d7d8">One answer does not settle the other two.</text><rect x="48" y="255" width="864" height="55" rx="8" fill="#1d424b"/><text x="70" y="291" font-size="23" fill="#fff">PERMISSION   May these offers combine?</text><rect x="48" y="325" width="864" height="55" rx="8" fill="#1d424b"/><text x="70" y="361" font-size="23" fill="#fff">ELIGIBILITY   Does this trip qualify?</text><rect x="48" y="395" width="864" height="55" rx="8" fill="#1d424b"/><text x="70" y="431" font-size="23" fill="#fff">PRICE   What does the quote show?</text></g><text x="48" y="510" font-family="Arial" font-size="16" fill="#c6d7d8">Original decision aid. No booking test or measured saving.</text></svg>